<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROCK PAPER SCISSOR</title>
    <link rel="stylesheet" href="rps.css">
    
</head>

<body>
    <header>
        <h1>ROCKS PAPER SCISSOR</h1>
    </header>

    <div class="arena">
        <div class="computer">
            <h2>Computer</h2>
            <img src="images/hand.png" class="handsigns">
        </div>
        <div class="gamestart">
            <button>Play</button>
            <div class="choices">
            <button>Rocks</button>
            <button>Paper</button>
            <button>Scissors</button>
            </div> 
        </div>
        <div class="player">
            <h2>Player</h2>
            <img src="images/hand.png">
        </div>

    </div>
    <div class="score">
        <div class="computerscore">
            <p>Computer</p>
            <p>Score:</p>
        </div>
        <div class="playerscore">
            <p>Player</p>
            <p>Score:</p>
        </div>

    </div>


<script src = "rps.js" ></script>
</body>

</html>
